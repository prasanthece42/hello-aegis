name: Aegis CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aegis-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: prasanthece42/aegis-platform/.github/workflows/python-web-ci.yml@5ea1b7e414b2e1f23fad849127e1bb72ded84b45
    with:
      app-id: hello-aegis
      platforms: '["amd64","arm64"]'
